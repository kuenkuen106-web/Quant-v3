name: UAT 回測 (逐日時光機)

on:
  workflow_dispatch:
    inputs:
      start_days:
        description: '本批起點（曆日）'
        required: true
        default: '2780'
      stop_days:
        description: '本批終點（曆日，最後一批必須係 0）'
        required: true
        default: '1318'
      wipe_history:
        description: '清空舊紀錄？（只有第一批揀 true）'
        type: choice
        options: ['false', 'true']
        default: 'false'
      exit_mode:
        description: '出場方案'
        type: choice
        options: ['B_runner', 'A_current']
        default: 'B_runner'
      pct_mode:
        description: '門檻模式：1=百分位 / 0=絕對值'
        type: choice
        options: ['1', '0']
        default: '1'
      history_suffix:
        description: '紀錄檔後綴（A/B 對照用，例如 _pct 或 _abs）'
        required: false
        default: '_pct'
      use_rs_strat:      {description: 'RS 核心策略 1/0', type: choice, options: ['1','0'], default: '1'}
      rs_top_n:          {description: 'Top N', default: '20'}
      rs_use_regime:     {description: 'L1 大市過濾 1/0', type: choice, options: ['0','1'], default: '0'}
      rs_use_trend:      {description: 'L2 個股趨勢 1/0', type: choice, options: ['0','1'], default: '0'}
      rs_max_extended:   {description: 'L3 距50MA上限 0=不限', default: '0'}
      rs_max_per_sector: {description: 'L4 板塊上限 0=不限', default: '0'}
      rs_stop_pct:       {description: 'L5 硬止損 0=冇', default: '0'}
      rs_hold_winners:   {description: 'L6 保留仍在榜 1/0', type: choice, options: ['0','1'], default: '0'}

permissions:
  contents: write

concurrency:
  group: uat-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip freeze > docs/UAT/pip-freeze.txt

      - name: 顯示本批設定
        run: |
          echo "起點 ${{ inputs.start_days }} → 終點 ${{ inputs.stop_days }}"
          echo "出場 ${{ inputs.exit_mode }} | 門檻 PCT=${{ inputs.pct_mode }} | 檔名後綴 '${{ inputs.history_suffix }}'"
          echo "清空舊紀錄：${{ inputs.wipe_history }}"

      - name: 清空舊回測紀錄（只喺第一批）
        if: ${{ inputs.wipe_history == 'true' }}
        run: |
          mkdir -p docs/UAT/charts
          rm -f docs/UAT/uat_trade_history${{ inputs.history_suffix }}.json
          rm -f docs/UAT/uat_trade_history${{ inputs.history_suffix }}.csv
          rm -f docs/UAT/watchlist_cache_*.json
          rm -f docs/UAT/stock_info_cache.json
          echo "🗑️ 已清空"

      - name: 建立資料夾（每批都要）
        run: mkdir -p docs/UAT/charts

      - name: 逐日跑回測
        env:
          PYTHONUNBUFFERED: "1"
          DISCORD_BACKTEST_WEBHOOK_URL: ${{ secrets.DISCORD_BACKTEST_WEBHOOK_URL }}
          DISCORD_BACKTEST_SUMMARY_WEBHOOK: ${{ secrets.DISCORD_BACKTEST_SUMMARY_WEBHOOK }}
          EXIT_MODE: ${{ inputs.exit_mode }}
          PCT_MODE: ${{ inputs.pct_mode }}
          HISTORY_SUFFIX: ${{ inputs.history_suffix }}
          UAT_END_DAYS: ${{ inputs.stop_days }}
          USE_LEGACY: ${{ inputs.use_legacy }}
          USE_RS_STRAT: ${{ inputs.use_rs_strat }}
          RS_TOP_N: ${{ inputs.rs_top_n }}
          RS_USE_REGIME: ${{ inputs.rs_use_regime }}
          RS_USE_TREND: ${{ inputs.rs_use_trend }}
          RS_MAX_EXTENDED: ${{ inputs.rs_max_extended }}
          RS_MAX_PER_SECTOR: ${{ inputs.rs_max_per_sector }}
          RS_STOP_PCT: ${{ inputs.rs_stop_pct }}
          RS_HOLD_WINNERS: ${{ inputs.rs_hold_winners }}
        run: |
          echo "🔎 ENV | EXT=[$RS_MAX_EXTENDED] STOP=[$RS_STOP_PCT] HOLD=[$RS_HOLD_WINNERS]"
          for d in $(seq ${{ inputs.start_days }} -1 ${{ inputs.stop_days }}); do
            if [ $((d % 50)) -eq 0 ]; then echo "===== 剩餘 $d 日 ====="; fi
            UAT_DAYS_AGO=$d python LHK_trading_script_backtest_v3.py \
              || { echo "❌ 第 $d 日失敗，中止"; exit 1; }
          done

      - name: 上載 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-${{ inputs.exit_mode }}-pct${{ inputs.pct_mode }}-${{ inputs.start_days }}to${{ inputs.stop_days }}
          path: |
            docs/UAT/index.html
            docs/UAT/uat_trade_history*.json
            docs/UAT/uat_trade_history*.csv

      - name: 提交到 main（含 rebase 重試
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/UAT
          echo "--- 準備 commit 嘅檔案 ---"
          git status --short docs/UAT
          git commit -m "UAT ${{ inputs.exit_mode }} pct${{ inputs.pct_mode }} ${{ inputs.start_days }}→${{ inputs.stop_days }}" \
            || { echo "⚠️ 無變更可提交"; exit 0; }
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "✅ 第 $i 次 push 成功"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "⚠️ 第 $i 次失敗，10 秒後重試..."; sleep 10
          done
          echo "❌ 5 次都 push 唔到，請去 Artifacts 下載"; exit 1

      - name: 顯示 Dashboard 連結
        if: success()
        run: |
          echo "### 🕰️ UAT Dashboard" >> $GITHUB_STEP_SUMMARY
          echo "https://kuenkuen106-web.github.io/Quant-v3/UAT/" >> $GITHUB_STEP_SUMMARY
          echo "本批：\`${{ inputs.start_days }}\` → \`${{ inputs.stop_days }}\`" >> $GITHUB_STEP_SUMMARY


name: UAT 回測 (逐日時光機)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      start_days:
        description: '回溯起點（曆日，730 ≈ 500 交易日）'
        required: true
        default: '730'
      exit_mode:
        description: '出場方案 (A_current / B_runner)'
        required: true
        default: 'B_runner'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 350        # GitHub 上限 6 小時

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance matplotlib requests lxml html5lib fake-useragent

      - name: 清空舊回測紀錄（重要！唔清會撈亂新舊策略嘅單）
        run: |
          mkdir -p docs/UAT/charts
          rm -f docs/UAT/uat_trade_history.json
          rm -f docs/UAT/uat_trade_history.csv

      - name: 逐日跑回測
        env:
          DISCORD_BACKTEST_WEBHOOK_URL: ${{ secrets.DISCORD_BACKTEST_WEBHOOK_URL }}
          DISCORD_BACKTEST_SUMMARY_WEBHOOK: ${{ secrets.DISCORD_BACKTEST_SUMMARY_WEBHOOK }}
          EXIT_MODE: ${{ github.event.inputs.exit_mode }}
        run: |
          START=${{ github.event.inputs.start_days }}
          for d in $(seq $START -1 0); do
            if [ $((d % 50)) -eq 0 ]; then echo "===== 進度：剩餘 $d 日 ====="; fi
            UAT_DAYS_AGO=$d python LHK_trading_script_backtest_v3.py
            if [ $? -ne 0 ]; then echo "❌ 第 $d 日失敗，中止"; exit 1; fi
          done

      - name: 提交結果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/UAT
          git commit -m "UAT 回測 ${{ github.event.inputs.exit_mode }} $(date +%F)" || echo "無變更"
          git push

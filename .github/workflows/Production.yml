name: RS Production

on:
  schedule:
    - cron: '17 8 * * 1-5'      # 🇯🇵 日股收市後（監察 only）
    - cron: '43 22 * * 1-5'     # 🇺🇸 美股收市後（可換倉）
  workflow_dispatch:
    inputs:
      force_rebalance:
        description: '強制換倉（第一次建倉用）'
        type: choice
        options: ['0', '1']
        default: '0'

permissions:
  contents: write

concurrency:
  group: rs-production
  cancel-in-progress: false

jobs:
  run-strategy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 獲取今日日期
        id: date_step
        run: echo "today=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: 💾 Cache market data
        uses: actions/cache@v4
        with:
          path: docs/market_data_cache.pkl
          key: ${{ runner.os }}-prod-mkt-${{ steps.date_step.outputs.today }}
          restore-keys: ${{ runner.os }}-prod-mkt-

      - name: 📦 安裝依賴
        run: pip install -r requirements.txt

      - name: 🚀 執行策略
        env:
          PYTHONUNBUFFERED: "1"
          DISCORD_SUMMARY_WEBHOOK: ${{ secrets.DISCORD_SUMMARY_WEBHOOK }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          INITIAL_EQUITY: "100000"
          FORCE_REBALANCE: ${{ inputs.force_rebalance || '0' }}
          ALLOW_REBALANCE: ${{ github.event.schedule == '17 8 * * 1-5' && '0' || '1' }}
        run: python LHK_trading_script_v3.py

      - name: 💾 更新 Dashboard
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "RS Production $(date +%F)" || { echo "無變更"; exit 0; }
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "✅ 第 $i 次 push 成功"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "⚠️ 第 $i 次失敗，10 秒後重試"; sleep 10
          done
          echo "❌ push 失敗"; exit 1

      - name: 失敗通知
        if: failure()
        run: |
          curl -H "Content-Type: application/json" -d \
            "{\"content\":\"🚨 **RS Production 失敗** ($(date +%F)) — 如果今日係月頭，請手動檢查換倉\"}" \
            "${{ secrets.DISCORD_SUMMARY_WEBHOOK }}"
